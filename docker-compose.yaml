version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clear-db-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clear_node}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clear_node}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: clear-db-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-2648}:${PORT:-2648}"
    environment:
      - CENTRAL_AUTH_URL=${CENTRAL_AUTH_URL}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-clear_node}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-2648}
    volumes:
      - ./data:/app/data
      - ./Logs:/app/Logs

volumes:
  pgdata:
